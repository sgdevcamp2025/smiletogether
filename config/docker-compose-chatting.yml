services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: always
    ports:
      - 27017:27017
    volumes:
      - data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=rootuser
      - MONGO_INITDB_ROOT_PASSWORD=rootpass
      - MONGO_INITDB_DATABASE=history-db
    networks:
      - smiletogether-network

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    restart: always
    ports:
      - 20000:8081
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=rootuser
      - ME_CONFIG_MONGODB_ADMINPASSWORD=rootpass
      - ME_CONFIG_MONGODB_SERVER=mongodb
    depends_on:
      - mongodb
    networks:
      - smiletogether-network

  history-server:
    image: imjanghyeok/smiletogether-history-server:latest
    container_name: history-server
    restart: always
    ports:
      - "8084:8084"
    depends_on:
      - mongodb
    networks:
      - smiletogether-network

  chat-server:
    image: imjanghyeok/smiletogether-chat-server:latest
    container_name: chat-server
    restart: always
    ports:
      - "8081:8081"
    networks:
      - smiletogether-network

  notification-server:
    image: imjanghyeok/smiletogether-notification-server:latest
    container_name: notification-server
    restart: always
    ports:
      - "8087:8087"
    networks:
      - smiletogether-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "5001:5001"
    environment:
      - KAFKA_CLUSTERS_0_NAME=LocalKafka
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka_01:9092,kafka_02:9092,kafka_03:9092
      - DYNAMIC_CONFIG_ENABLED=true
    depends_on:
      - kafka_01
    networks:
      - smiletogether-network

  kafka_00:
    image: bitnami/kafka:3.7.0
    container_name: kafka_00
    restart: unless-stopped
    ports:
      - '9093:9093'
      - '19000:19000'
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_KRAFT_MODE=true
      - KAFKA_CFG_PROCESS_ROLES=controller
      - KAFKA_KRAFT_CLUSTER_ID=hPThGFTUS4u1FxH9KPznxg==
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka_00:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT
      - KAFKA_LISTENERS=CONTROLLER://0.0.0.0:9093
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
    networks:
      - smiletogether-network

  kafka_01:
    image: bitnami/kafka:3.7.0
    container_name: kafka_01
    restart: unless-stopped
    ports:
      - '9094:9092'
      - '19001:19001'
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_KRAFT_MODE=true
      - KAFKA_CFG_PROCESS_ROLES=broker
      - KAFKA_KRAFT_CLUSTER_ID=hPThGFTUS4u1FxH9KPznxg==
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka_00:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_LISTENERS=INTERNAL://0.0.0.0:9092,EXTERNAL://kafka_01:19001
      - KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafka_01:9092,EXTERNAL://localhost:19001
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
    networks:
      - smiletogether-network

  kafka_02:
    image: bitnami/kafka:3.7.0
    container_name: kafka_02
    restart: unless-stopped
    ports:
      - '9095:9092'
      - '19002:19002'
    environment:
      - KAFKA_CFG_NODE_ID=2
      - KAFKA_KRAFT_MODE=true
      - KAFKA_CFG_PROCESS_ROLES=broker
      - KAFKA_KRAFT_CLUSTER_ID=hPThGFTUS4u1FxH9KPznxg==
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka_00:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_LISTENERS=INTERNAL://0.0.0.0:9092,EXTERNAL://kafka_02:19002
      - KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafka_02:9092,EXTERNAL://localhost:19002
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
    networks:
      - smiletogether-network

  kafka_03:
    image: bitnami/kafka:3.7.0
    container_name: kafka_03
    restart: unless-stopped
    ports:
      - '9096:9092'
      - '19003:19003'
    environment:
      - KAFKA_CFG_NODE_ID=3
      - KAFKA_KRAFT_MODE=true
      - KAFKA_CFG_PROCESS_ROLES=broker
      - KAFKA_KRAFT_CLUSTER_ID=hPThGFTUS4u1FxH9KPznxg==
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka_00:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_LISTENERS=INTERNAL://0.0.0.0:9092,EXTERNAL://kafka_03:19003
      - KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafka_03:9092,EXTERNAL://localhost:19003
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
    networks:
      - smiletogether-network

networks:
  smiletogether-network:
    name: smiletogether-network
    driver: bridge

volumes:
  data:
  kafka_00:
  kafka_01:
  kafka_02:
  kafka_03:
